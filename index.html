<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Casino Royale — Slots, Roulette, Blackjack, Horses, Crash, Arcade, Frogger, Chests, Neon Recall &amp; Russian Roulette</title>
<meta name="description" content="Start with 1000 dollars and try to beat the house across twelve machines: slot machines, roulette, blackjack, horse racing, rocket crash, an arcade maze where skill pays off, a frog who has to judge real traffic one lane at a time, a nine-chest treasure gamble with a Lucky Star second chance, a colour-memory wheel where you repeat an ever-longer flashing pattern until your nerve breaks, a six-chamber revolver gamble where a blank doubles your bank, the drum gets heavier the further you push, and a live round takes the lot, and a real Texas Hold'em table against up to three bots. Level up, buy stacking perks, toggle idle auto-play, take a 1-hour loan when you go broke, or hit BANKRUPT to see the full story of your run.">
<meta property="og:title" content="Casino Royale">
<meta property="og:description" content="Start with 1000 dollars and try to beat the house across twelve machines: slot machines, roulette, blackjack, horse racing, rocket crash, an arcade maze where skill pays off, a frog who has to judge real traffic one lane at a time, a nine-chest treasure gamble with a Lucky Star second chance, a colour-memory wheel where you repeat an ever-longer flashing pattern until your nerve breaks, a six-chamber revolver gamble where a blank doubles your bank, the drum gets heavier the further you push, and a live round takes the lot, and a real Texas Hold'em table against up to three bots. Level up, buy stacking perks, toggle idle auto-play, take a 1-hour loan when you go broke, or hit BANKRUPT to see the full story of your run.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<div id="app">
  <header id="topbar">
    <div class="brand">
      <span class="brand-suit">&#9824;</span>
      <div class="brand-text">
        <div class="brand-name">CASINO ROYALE</div>
        <div class="brand-sub">beat the house</div>
      </div>
    </div>

    <div class="tstats">
      <div class="tstat">
        <div class="tstat-label">Balance</div>
        <div class="tstat-value money" id="moneyEl">0</div>
      </div>
      <div class="tstat wide">
        <div class="tstat-label">Level <span id="levelEl">1</span><span class="tier-tag" id="tierEl" hidden></span></div>
        <div class="xpbar"><div class="xpfill" id="xpFillEl"></div><span class="xptext" id="xpTextEl">0 / 0</span></div>
      </div>
      <div class="tstat">
        <div class="tstat-label">Luck</div>
        <div class="tstat-value luck" id="luckEl">+0.0%</div>
      </div>
      <div class="tstat">
        <div class="tstat-label">Best Win</div>
        <div class="tstat-value small" id="bestWinEl">0</div>
      </div>
    </div>

    <div class="ttools">
      <div class="idlebox" id="idleBox">
        <button id="idleToggleBtn" class="pill" type="button">IDLE OFF</button>
        <label class="idlebet">
          <span>Bet</span>
          <input id="idleBetInput" type="number" min="1" step="1" value="10">
        </label>
      </div>
      <button id="perkShopBtn" class="btn gold shopbtn" type="button">
        <span class="shopicon">&#128142;</span> PERKS <span class="badge" id="perkBadge">0</span>
      </button>
      <button id="loanBtn" class="btn ghost toolbtn" type="button">&#127974; LOAN</button>
      <button id="historyBtn" class="btn ghost toolbtn" type="button">&#128220; HISTORY</button>
      <button id="bankruptBtn" class="btn ghost toolbtn danger" type="button">&#128165; BANKRUPT</button>
      <button id="cloudBtn" class="btn ghost toolbtn cloudbtn" type="button" hidden>
        <span class="cloud-ico" aria-hidden="true">&#9729;</span><span class="cloud-txt">SIGN IN</span><span class="cloud-dot" aria-hidden="true"></span>
      </button>
      <button id="musicBtn" class="btn ghost toolbtn soundbtn" type="button" title="Music on" aria-label="Mute music">&#127925;</button>
      <button id="soundBtn" class="btn ghost toolbtn soundbtn" type="button" title="Sound on" aria-label="Mute sound">&#128266;</button>
    </div>
  </header>

  <div id="loanBar" class="loanbar" hidden>
    <div class="loan-left">
      <span class="loan-tag">LOAN</span>
      <span id="loanText">repay</span>
    </div>
    <div class="loan-right">
      <span class="loan-clock" id="loanClock">60:00</span>
      <div class="loan-progress"><div class="loan-fill" id="loanFill"></div></div>
      <button id="loanRepayBtn" class="loan-repay" type="button" title="Pay the loan off now">&#128179; PAY BACK</button>
    </div>
  </div>

  <main id="layout">
    <nav id="machineNav" aria-label="Machines"></nav>
    <section id="stage"></section>
    <aside id="betPanel"></aside>
  </main>

  <footer id="siteFoot">
    <span class="foot-fine">Free-to-play &middot; fictional currency &middot; no real-money gambling</span>
    <span class="foot-links">
      <a id="privacyLink" class="foot-link" href="privacy.html" target="_blank" rel="noopener noreferrer">Privacy Policy</a>
    </span>
  </footer>
</div>

<div id="cheatBox">
  <div id="cheatPanel" class="cheat-panel" hidden>
    <input id="cheatInput" class="cheat-input" type="text" placeholder="enter code…" autocomplete="off" spellcheck="false">
  </div>
  <button id="cheatBtn" class="cheat-btn" type="button" title="Code entry" aria-label="Enter a code">&#128273;</button>
</div>

<div id="toastLayer"></div>
<div id="fxLayer"></div>
<div id="modalLayer" hidden></div>

<script type="module" src="main.js"></script>
</body>
</html>
